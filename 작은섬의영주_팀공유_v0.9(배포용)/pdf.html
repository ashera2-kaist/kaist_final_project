<!doctype html>
<!-- [카톡공유] v0.9 — 카카오톡 「PDF 열기」 버튼이 오는 곳.
     카카오 메시지의 버튼 주소는 카카오 앱에 등록한 도메인(게임 주소)이어야 해서, 게임 폴더의 이 페이지가 서버 PDF로 넘겨 준다.
     f = book-pdfs 버킷 안 경로(날짜/무작위.pdf)만 받는다 — 다른 주소로 넘기는 데 쓰이지 않게 형식을 검사한다.
     PDF는 7일 뒤 지워진다(db/storage_v1_book_pdfs.sql) → 없으면 "기간이 지났어요" 안내 -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>금융 도감 책 (PDF) — 작은 섬의 영주</title>
<meta property="og:title" content="금융 도감 책 (PDF) — 작은 섬의 영주">
<meta property="og:image" content="https://ashera2-kaist.github.io/kaist_final_project/%EC%9E%91%EC%9D%80%EC%84%AC%EC%9D%98%EC%98%81%EC%A3%BC_%ED%8C%80%EA%B3%B5%EC%9C%A0_v0.9(%EB%B0%B0%ED%8F%AC%EC%9A%A9)/share_og.png">
<style>
  :root{--ink:#22190F;--paper:#F3E6C8;--sub:#6A5636}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1526;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);padding:16px;box-sizing:border-box}
  .box{width:100%;max-width:420px;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.55);padding:22px 18px;text-align:center}
  h1{font-size:22px;margin:6px 0 8px}
  p{margin:6px 0;font-size:15px;line-height:1.6;color:var(--sub);word-break:keep-all}
  a.btn{display:block;margin:12px 0 0;padding:13px;border:3px solid var(--ink);background:#FFFBEE;color:var(--ink);font-weight:700;font-size:16px;text-decoration:none;box-shadow:3px 3px 0 #C9B383}
  a.btn.main{background:#F2C14E}
  [hidden]{display:none!important}
</style></head><body>
<div class="box">
  <div style="font-size:42px">📕</div>
  <h1 id="t">금융 도감 책 (PDF)</h1>
  <p id="msg">PDF를 여는 중이에요…</p>
  <a class="btn main" id="open" hidden>📕 PDF 열기</a>
  <a class="btn" id="down" hidden>⬇️ 휴대폰에 내려받기</a>
  <a class="btn" id="game" href="./">🏝️ 게임 해 보기</a>
</div>
<script>
(async function(){
  const SB = { url: 'https://pposrdpdznaladikwoig.supabase.co', bucket: 'book-pdfs', keepDays: 7 };
  const $ = s => document.querySelector(s), msg = t => { $('#msg').textContent = t; };
  const f = new URLSearchParams(location.search).get('f') || '';
  if(!/^\d{4}-\d{2}-\d{2}\/[0-9a-f-]{36}\.pdf$/.test(f)){ msg('주소가 올바르지 않아요. 카카오톡 메시지의 버튼을 다시 눌러 주세요.'); return; }
  const view = `${SB.url}/storage/v1/object/public/${SB.bucket}/${f}`, down = `${view}?download=${encodeURIComponent('금융도감.pdf')}`;
  $('#open').href = view; $('#down').href = down;
  try{
    const r = await fetch(view, { method: 'HEAD', cache: 'no-store' });
    if(!r.ok){ msg(`이 PDF는 보관 기간(${SB.keepDays}일)이 지나 지워졌어요. 아이에게 게임에서 도감 책을 다시 만들어 보내 달라고 해 주세요.`); return; }
  }catch(e){ /* 확인이 안 되면 그냥 열어 본다 */ }
  $('#open').hidden = false; $('#down').hidden = false;
  msg(`만든 날부터 ${SB.keepDays}일 동안 열 수 있어요. 안 열리면 아래 버튼을 눌러 주세요.`);
  const android = /Android/i.test(navigator.userAgent);
  location.replace(android ? down : view);   // 안드로이드 카톡 안 브라우저는 PDF를 화면에 못 띄워서 내려받기로
})();
</script>
</body></html>
