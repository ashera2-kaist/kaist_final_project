<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>망한 섬의 영주 애니메틱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 상영실 레이아웃: 16:9 스크린 하나, 그 아래 컨트롤 바와 컷 리스트. 영상 감상용이라 어두운 단일 테마로 고정 */
:root{
  --bg:#15131c; --panel:#1f1b28; --line:#2f2a3a; --fg:#ece6dc; --muted:#a39bac; --accent:#f0b35a;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,4vw,36px);line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;margin:0}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:100%}
.play-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,14,.3);border:0;cursor:pointer;color:var(--fg);font:inherit;padding:0}
.play-overlay span{display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:rgba(21,19,28,.82);border:1px solid rgba(240,179,90,.6);font-weight:600}
.play-overlay:focus-visible span,.btn:focus-visible,.shot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#231a10;border-color:var(--accent);font-weight:600;min-width:92px}
#scrub{flex:1;min-width:150px;accent-color:var(--accent)}
.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.loop{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.shots{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.shots h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:14px 0 4px}
.shot{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:12px 10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:0}
.shot:hover{background:rgba(255,255,255,.03)}
.shot .time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);padding-top:2px}
.shot .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.shot .t{font-weight:600}
.shot .n{color:var(--muted);font-size:14px}
.shot.active{background:var(--panel)}
.shot.active .time{color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin:0}
@media (max-width:520px){.shot{grid-template-columns:1fr;gap:4px}}
body.embed-mode .wrap{max-width:none;padding:0;gap:0}
body.embed-mode header,
body.embed-mode .controls,
body.embed-mode .shots,
body.embed-mode .note{display:none}
body.embed-mode .screen{border-radius:0;box-shadow:none;aspect-ratio:16/9;width:100%;height:auto}
body.embed-mode .play-overlay{display:none}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">게임 오프닝 트레일러 · 2D 애니메틱 v1</div>
    <h1>눈 떠 보니, 망한 섬의 열두 살 영주?</h1>
    <p class="meta">15초 · 16:9 · 5컷 · 무음</p>
  </header>

  <div class="screen">
    <canvas id="stage" aria-label="15초 트레일러 애니메틱"></canvas>
    <button class="play-overlay" id="overlay" type="button"><span>▶ <b id="overlayLabel">튜토리얼 재생</b></span></button>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn" type="button">재생</button>
    <button class="btn" id="restartBtn" type="button">처음부터</button>
    <input type="range" id="scrub" min="0" max="15" step="0.01" value="0" aria-label="재생 위치">
    <span class="tc" id="tc">00:00.0 / 00:15.0</span>
    <label class="loop"><input type="checkbox" id="loop"> 반복</label>
  </div>

  <section class="shots" id="shots">
    <h2>컷 구성 · 누르면 그 컷부터 재생</h2>
  </section>
  <p class="note">소리는 없습니다. 음악 히트 지점(14.2초)은 화면 번쩍임과 흔들림으로 표시했어요.</p>
</div>

<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const W=1280,H=720;cv.width=W;cv.height=H;
const PI=Math.PI,DUR=15;
const FD='"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FB='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const C={skin:'#f1c7a1',skinSh:'#d49e7a',hair:'#5a3a28',pj:'#7092c2',pjD:'#526c9c',ink:'#2b2230',old:'#e6b894'};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const pr=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eio=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const eout=k=>1-Math.pow(1-k,3);
const back=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};

function path(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);}
function poly(p,c){path(p);ctx.closePath();ctx.fillStyle=c;ctx.fill();}
function box(x,y,w,h,r,c){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,PI*2);ctx.fillStyle=c;ctx.fill();}
function ell(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,PI*2);ctx.fillStyle=c;ctx.fill();}
function line(p,c,w){path(p);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
function vgrad(y0,y1,s){const g=ctx.createLinearGradient(0,y0,0,y1);s.forEach((c,i)=>g.addColorStop(i/(s.length-1),c));return g;}
function fillAll(c){ctx.fillStyle=c;ctx.fillRect(-300,-300,W+600,H+600);}
function text(s,x,y,size,c,o={}){ctx.font=`${size}px ${o.font||FD}`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(o.stroke){ctx.lineWidth=o.sw||8;ctx.strokeStyle=o.stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=c;ctx.fillText(s,x,y);}
function cam(cx,cy,z,dx=0,dy=0,rot=0){ctx.translate(W/2+dx,H/2+dy);ctx.rotate(rot);ctx.scale(z,z);ctx.translate(-cx,-cy);}
function whiteOver(a){if(a>0){ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(0,0,W,H);}}
function blackOver(a){if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}}

/* ---------- 캐릭터 ---------- */
function head(o={}){
  const R=44;
  if(o.back){
    ell(-43,6,7,11,C.skin);ell(43,6,7,11,C.skin);
    circ(0,0,R+2,C.hair);
    const sw=o.sway||0;line([[0,-44],[8+sw*5,-66],[22+sw*8,-58]],C.hair,7);
    return;
  }
  ell(-43,6,8,11,C.skin);ell(43,6,8,11,C.skin);
  circ(0,0,R,C.skin);
  ctx.beginPath();ctx.moveTo(-46,0);ctx.bezierCurveTo(-52,-54,52,-58,46,0);
  [[38,-12],[28,-4],[18,-17],[4,-7],[-10,-19],[-22,-7],[-34,-15]].forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.closePath();ctx.fillStyle=C.hair;ctx.fill();
  line([[0,-44],[8,-66],[22,-58]],C.hair,7);
  circ(-26,16,7,'rgba(226,116,104,.35)');circ(26,16,7,'rgba(226,116,104,.35)');
  const ex=15,ey=4,lk=(o.look||0)*3;
  if(o.eyes==='closed'){
    ctx.beginPath();ctx.arc(-ex,ey-2,7,.15*PI,.85*PI);
    ctx.moveTo(ex+7*Math.cos(.15*PI),ey-2+7*Math.sin(.15*PI));ctx.arc(ex,ey-2,7,.15*PI,.85*PI);
    ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  }else{
    const w=o.eyes==='wide',rx=w?10:8,ry=w?12:10,p=w?5:6;
    ell(-ex,ey,rx,ry,'#fff');ell(ex,ey,rx,ry,'#fff');
    circ(-ex+lk,ey+1,p,C.ink);circ(ex+lk,ey+1,p,C.ink);
    circ(-ex+lk+2,ey-2,1.8,'#fff');circ(ex+lk+2,ey-2,1.8,'#fff');
  }
  const B={worried:[[-25,-12],[-8,-18],[8,-18],[25,-12]],up:[[-25,-20],[-8,-23],[8,-23],[25,-20]],determined:[[-25,-19],[-7,-11],[7,-11],[25,-19]]}[o.brow];
  if(B){line([B[0],B[1]],C.ink,4);line([B[2],B[3]],C.ink,4);}
  const m=o.mouth||'smile';
  if(m==='smile'){ctx.beginPath();ctx.arc(0,20,7,.2*PI,.8*PI);ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.stroke();}
  else if(m==='o')ell(0,25,5,6.5,C.ink);
  else if(m==='set')line([[-8,25],[8,23]],C.ink,3.5);
  else if(m==='sleep')ell(0,24,3,2,C.ink);
}
function boy(x,y,s,o={}){
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.scale(s,s);
  ell(-14,-3,12,6,C.skin);ell(14,-3,12,6,C.skin);
  box(-24,-72,20,68,9,C.pjD);box(4,-72,20,68,9,C.pjD);
  box(-34,-134,68,74,22,C.pj);
  ctx.save();ctx.beginPath();ctx.roundRect(-34,-134,68,74,22);ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.2)';for(let i=-30;i<34;i+=14)ctx.fillRect(i,-134,5,74);ctx.restore();
  if(!o.back)poly([[-11,-134],[11,-134],[0,-119]],C.skin);
  line([[-30,-122],[-44,-94],[-42,-70]],C.pj,17);circ(-42,-66,9,C.skin);
  const arm=o.arm||'down';
  if(arm==='point'){line([[30,-122],[50,-100],[14,-104]],C.pj,17);circ(12,-104,9,C.skin);line([[6,-106],[-4,-109]],C.skin,6);}
  else if(arm==='fist'){line([[30,-122],[58,-112],[56,-150]],C.pj,17);circ(56,-158,13,C.skin);}
  else{line([[30,-122],[44,-94],[42,-70]],C.pj,17);circ(42,-66,9,C.skin);}
  ctx.translate(0,-176);head(o);
  ctx.restore();
}
function elder(x,y,s,bow){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ell(-14,-3,13,6,'#4a3b2c');ell(14,-3,13,6,'#4a3b2c');
  poly([[-40,-2],[40,-2],[30,-84],[-30,-84]],'#6f5f45');
  ctx.translate(0,-80);ctx.rotate(-bow);
  box(-32,-84,64,90,22,'#8a7856');
  ctx.fillStyle='#a8513f';ctx.fillRect(-32,-26,64,11);
  ctx.save();ctx.translate(0,-124);
  circ(0,0,38,C.old);
  ell(-34,-2,11,15,'#efece4');ell(34,-2,11,15,'#efece4');
  line([[-22,-14],[-6,-12]],'#efece4',6);line([[6,-12],[22,-14]],'#efece4',6);
  ctx.beginPath();ctx.arc(-13,0,6,1.1*PI,1.9*PI);ctx.moveTo(13+6*Math.cos(1.1*PI),6*Math.sin(1.1*PI));ctx.arc(13,0,6,1.1*PI,1.9*PI);
  ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();ctx.moveTo(-28,12);ctx.quadraticCurveTo(-18,74,0,78);ctx.quadraticCurveTo(18,74,28,12);ctx.quadraticCurveTo(0,26,-28,12);ctx.fillStyle='#f3f0e8';ctx.fill();
  circ(0,8,6,'#d49a78');ell(-9,16,10,5,'#f3f0e8');ell(9,16,10,5,'#f3f0e8');
  ctx.restore();
  line([[-24,-72],[-34,-34],[-10,-22]],'#8a7856',16);circ(-8,-22,9,C.old);
  ctx.restore();
}
function villager(x,y,s,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const c=o.c||'#8d7a6a',c2=o.c2||'#7a6858';
  ell(-12,-3,11,5,'#3e3328');ell(12,-3,11,5,'#3e3328');
  box(-28,-104,56,102,20,c);
  if(o.belly){line([[-24,-90],[-30,-60],[-6,-52]],c2,14);line([[24,-90],[30,-60],[6,-52]],c2,14);}
  else{line([[-24,-90],[-32,-50]],c2,14);line([[24,-90],[32,-50]],c2,14);}
  ctx.translate(0,-132);
  circ(0,0,30,o.skin||'#e6bd98');
  if(!o.hat){ctx.beginPath();ctx.arc(0,-8,31,PI,0);ctx.fillStyle=o.hair||'#6b5040';ctx.fill();}
  circ(-10,4,3.5,C.ink);circ(10,4,3.5,C.ink);
  line([[-16,-5],[-6,-9]],C.ink,2.5);line([[6,-9],[16,-5]],C.ink,2.5);
  ctx.beginPath();ctx.arc(0,20,6,1.15*PI,1.85*PI);ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.stroke();
  if(o.hat){ell(0,-20,44,9,'#c9a25a');ell(0,-28,22,14,'#c9a25a');}
  ctx.restore();
}
function house(x,y,s,c,broken){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  box(-40,-60,80,60,3,'#d8c8a8');
  if(broken){poly([[-50,-58],[-5,-100],[10,-86],[0,-70],[20,-80],[50,-58]],c);
    ctx.fillStyle='#3a2e28';ctx.fillRect(-26,-44,18,18);line([[-28,-46],[-6,-24]],'#7a5a3a',4);line([[-6,-46],[-28,-24]],'#7a5a3a',4);}
  else{poly([[-50,-58],[0,-100],[50,-58]],c);ctx.fillStyle='#4a3a30';ctx.fillRect(-26,-44,18,18);}
  ctx.fillStyle='#5a4535';ctx.fillRect(8,-36,20,36);
  ctx.restore();
}
function stall(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#6d5440';ctx.fillRect(-50,-70,6,70);ctx.fillRect(44,-70,6,70);
  poly([[-58,-74],[58,-74],[50,-54],[20,-58],[0,-50],[-30,-56],[-58,-54]],'#b86a5a');
  box(-50,-30,100,16,3,'#8a6a4a');
  ctx.restore();
}
function coin(x,y,spin){const w=Math.abs(Math.cos(spin))*12+2;ell(x,y,w,12,'#9c7a2a');ell(x,y,w*.78,10,'#e8c257');}

/* ---------- 컷 1: 침실 (0–3초) ---------- */
function sBedroom(lt){
  const z=1+.16*eio(pr(lt,0,2.3));
  const surprised=lt>2.15;
  const shake=(lt>2.15&&lt<2.4)?Math.sin(lt*90)*4:0;
  ctx.save();cam(700,420,z,shake,0);
  fillAll('#2b3456');
  ctx.fillStyle='#222944';ctx.fillRect(-300,560,W+600,500);
  box(160,110,280,230,8,'#1b2140');
  ctx.fillStyle=vgrad(122,330,['#1d2a5a','#34457a']);ctx.fillRect(174,124,252,202);
  circ(350,190,28,'#f1ead0');
  [[210,160],[260,140],[240,250],[300,280],[395,262],[395,150]].forEach(([a,b])=>circ(a,b,2,'#e8e2c8'));
  ctx.fillStyle='#1b2140';ctx.fillRect(296,124,8,202);ctx.fillRect(174,222,252,8);
  box(128,96,60,262,14,'#46507f');box(412,96,60,262,14,'#46507f');
  ctx.fillStyle='#3a3048';ctx.fillRect(900,200,220,10);
  [['#8a5a5a',26,60],['#5a7a8a',22,70],['#8a8a5a',30,54],['#6a5a8a',20,66],['#7a6a5a',24,58]].reduce((x,[c,w,h])=>{box(x,200-h,w,h,3,c);return x+w+4;},920);
  box(540,330,600,130,24,'#6e5139');
  box(520,440,660,130,28,'#e3ddd0');
  ell(700,452,96,40,'#f4f0e8');
  ctx.save();ctx.translate(700,surprised?402:414);ctx.rotate(surprised?-.12:-.3);
  head({eyes:surprised?'wide':'closed',brow:surprised?'up':null,mouth:surprised?'o':'sleep'});ctx.restore();
  ctx.beginPath();ctx.roundRect(735,420,460,160,[60,20,20,20]);ctx.fillStyle='#5e8a80';ctx.fill();
  ctx.fillStyle='rgba(255,240,200,.35)';
  [[820,470],[900,525],[980,462],[1060,522],[1120,470]].forEach(([a,b])=>{ctx.beginPath();for(let i=0;i<5;i++){const an=-PI/2+i*4*PI/5;ctx.lineTo(a+8*Math.cos(an),b+8*Math.sin(an));}ctx.closePath();ctx.fill();});
  if(lt<1.7){for(let i=0;i<3;i++){const k=(lt*.7+i/3)%1;ctx.globalAlpha=Math.sin(k*PI)*(1-pr(lt,1.3,1.7));text('z',770+k*60,380-k*90,22+i*6,'#cfd6f0',{font:FB});}ctx.globalAlpha=1;}
  if(surprised){const k=pr(lt,2.15,2.35);ctx.globalAlpha=k;text('!',770,330-10*back(k),56,'#fff4c8',{stroke:C.ink,sw:6});ctx.globalAlpha=1;}
  const g=pr(lt,1.3,2.8);
  if(g>0){const rg=ctx.createRadialGradient(300,225,10,300,225,60+1100*eio(g));rg.addColorStop(0,`rgba(255,255,255,${.95*g})`);rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(-300,-300,W+600,H+600);}
  ctx.restore();
  whiteOver(pr(lt,2.55,3));
}

/* ---------- 컷 2: 낡은 항구 건물 (3–6초) ---------- */
function sHarbor(lt){
  const pan=-50*eio(pr(lt,0,3));
  ctx.save();cam(W/2,H/2,1.02,pan,0);
  fillAll('#6b5240');
  ctx.strokeStyle='rgba(40,28,20,.45)';ctx.lineWidth=3;
  for(let x=-256;x<W+256;x+=64){ctx.beginPath();ctx.moveTo(x,-300);ctx.lineTo(x,566);ctx.stroke();}
  ctx.fillStyle='rgba(255,230,180,.22)';ctx.fillRect(254,60,4,140);ctx.fillRect(574,280,4,110);
  ctx.fillStyle='#8a6a4b';ctx.fillRect(-300,565,W+600,500);
  ctx.strokeStyle='rgba(50,34,22,.4)';ctx.lineWidth=2;[598,640,696].forEach(y=>{ctx.beginPath();ctx.moveTo(-300,y);ctx.lineTo(W+300,y);ctx.stroke();});
  const wx=700,wy=110,ww=440,wh=300;
  ctx.save();ctx.beginPath();ctx.rect(wx,wy,ww,wh);ctx.clip();
  ctx.fillStyle=vgrad(wy,wy+wh,['#b9cfd3','#e6dcc2']);ctx.fillRect(wx,wy,ww,wh);
  ell(790+lt*6,150,50,14,'rgba(255,255,255,.6)');ell(1040+lt*6,170,70,16,'rgba(255,255,255,.5)');
  ctx.fillStyle='#648c98';ctx.fillRect(wx,300,ww,120);
  poly([[wx,300],[800,250],[900,262],[1000,240],[wx+ww,280],[wx+ww,332],[wx,332]],'#88a078');

const $=id=>document.getElementById(id);
const playBtn=$('playBtn'),scrub=$('scrub'),tc=$('tc'),overlay=$('overlay'),loopEl=$('loop');
const params=new URLSearchParams(location.search);
const EMBED_MODE=params.get('embed')==='1'||window.parent!==window;
const AUTOSTART=params.get('start')==='1';
let t=0,playing=false,last=0,first=true;

if(EMBED_MODE){
  document.body.classList.add('embed-mode');
  overlay.hidden=true;
  if(window.parent!==window)window.parent.postMessage('animatic:ready','*');
}
const pad=n=>String(n).padStart(2,'0');
const fmtTC=x=>`00:${pad(Math.floor(x))}.${Math.floor((x%1)*10)}`;
SHOTS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='shot';b.id='shot'+i;
  b.innerHTML=`<span class="time">${pad(s.a)}.0 – ${pad(s.b)}.0초</span><span class="txt"><span class="t">${i+1}. ${s.t}</span><span class="n">${s.n}</span></span>`;
  b.addEventListener('click',()=>{first=false;t=s.a;play();});$('shots').appendChild(b);});
function syncUI(){
  scrub.value=t;tc.textContent=`${fmtTC(Math.min(t,DUR))} / 00:15.0`;
  playBtn.textContent=playing?'일시정지':'재생';
  const cur=SHOTS.findIndex(s=>t<s.b);const idx=cur<0?4:cur;
  SHOTS.forEach((_,i)=>$('shot'+i).classList.toggle('active',!first&&i===idx));
}
function frame(now){
  if(!playing)return;
  t+=Math.min(.1,(now-last)/1000);last=now;
  if(t>=DUR){
    t=DUR;playing=false;render(t);syncUI();
    if(window.parent!==window){
      window.parent.postMessage('animatic:ended','*');
    }
    return;
  }
  render(t);syncUI();requestAnimationFrame(frame);
}
function play(){if(t>=DUR)t=0;playing=true;overlay.hidden=true;last=performance.now();syncUI();requestAnimationFrame(frame);}
function pause(){playing=false;syncUI();}
overlay.addEventListener('click',()=>{if(first){first=false;t=0;}play();});
playBtn.addEventListener('click',()=>{if(playing)pause();else{if(first){first=false;t=0;}play();}});
$('restartBtn').addEventListener('click',()=>{first=false;t=0;play();});
scrub.addEventListener('input',()=>{first=false;playing=false;overlay.hidden=true;t=parseFloat(scrub.value);render(t);syncUI();});
window.startAnimatic=()=>{
  first=false;t=0;play();
  if(EMBED_MODE&&window.parent!==window)window.parent.postMessage('animatic:started','*');
};
window.addEventListener('message',e=>{if(e.data==='animatic:start')window.startAnimatic();});

const POSTER=14.0;
render(POSTER);syncUI();
if(AUTOSTART)window.startAnimatic();
if(document.fonts&&document.fonts.load){document.fonts.load('56px "Black Han Sans"').then(()=>{if(first)render(POSTER);else render(t);}).catch(()=>{});}
</script>

</body></html>
